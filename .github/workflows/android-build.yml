name: Android Build

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          cmake-version: '3.22.1'

      - name: Cache Gradle packages
        uses: actions/cache@v7
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/build-scripts/tuxguitar-android/gradlew

      - name: Build Debug APK
        run: |
          cd android/build-scripts/tuxguitar-android
          ./gradlew :apk:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          cd android/build-scripts/tuxguitar-android
          ./gradlew :apk:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tuxguitar-android-debug
          path: android/build-scripts/tuxguitar-android/apk/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: tuxguitar-android-release
          path: android/build-scripts/tuxguitar-android/apk/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload native libraries info
        run: |
          echo "## Native Libraries Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find android/build-scripts/tuxguitar-android -name "*.so" -path "*/build/*" | head -20 | while read lib; do
            echo "- \`$lib\`" >> $GITHUB_STEP_SUMMARY
          done

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c

      - name: Make gradlew executable
        run: chmod +x android/build-scripts/tuxguitar-android/gradlew

      - name: Run Lint
        run: |
          cd android/build-scripts/tuxguitar-android
          ./gradlew :apk:lintDebug --no-daemon --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: android/build-scripts/tuxguitar-android/apk/build/reports/lint-results-debug.html
          retention-days: 30