name: Android Build

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libsndfile1-dev \
            libreadline-dev \
            pkg-config \
            cmake \
            ninja-build

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          # Android SDK is pre-installed on ubuntu-24.04
          # Just accept licenses and install required packages
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x android/build-scripts/tuxguitar-android/gradlew

      - name: Build Debug APK
        run: |
          cd android/build-scripts/tuxguitar-android
          ./gradlew :apk:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-debug.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: android/build-scripts/tuxguitar-android/build-debug.log
          retention-days: 30

      - name: Build Release APK
        run: |
          cd android/build-scripts/tuxguitar-android
          ./gradlew :apk:assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build-release.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: android/build-scripts/tuxguitar-android/build-release.log
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxguitar-android-debug
          path: android/build-scripts/tuxguitar-android/apk/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxguitar-android-release
          path: android/build-scripts/tuxguitar-android/apk/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload native libraries info
        run: |
          echo "## Native Libraries Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find android/build-scripts/tuxguitar-android -name "*.so" -path "*/build/*" | head -20 | while read lib; do
            echo "- \`$lib\`" >> $GITHUB_STEP_SUMMARY
          done

  lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libsndfile1-dev \
            libreadline-dev \
            pkg-config \
            cmake \
            ninja-build

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null

      - name: Make gradlew executable
        run: chmod +x android/build-scripts/tuxguitar-android/gradlew

      - name: Run Lint
        run: |
          cd android/build-scripts/tuxguitar-android
          ./gradlew :apk:lintDebug --no-daemon --stacktrace --info 2>&1 | tee lint-debug.log

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-debug-log
          path: android/build-scripts/tuxguitar-android/lint-debug.log
          retention-days: 30

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/build-scripts/tuxguitar-android/apk/build/reports/lint-results-debug.html
          retention-days: 30