# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Ubuntu Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Update repos
      run: sudo apt-get update
    - name: Install packages
      run: sudo apt install -y wget unzip git build-essential default-jdk maven libwebkit2gtk-4.1-0 libfluidsynth-dev libjack-jackd2-dev libasound2-dev liblilv-dev libsuil-dev qtbase5-dev
    - name: Download SWT
      run: |
        SWT_VERSION=4.37
        ARCH=$(uname -m)
        curl -fsSL -o "swt-${SWT_VERSION}-gtk-linux-${ARCH}.zip" \
          "https://archive.eclipse.org/eclipse/downloads/drops4/R-${SWT_VERSION}-202509050730/swt-${SWT_VERSION}-gtk-linux-${ARCH}.zip"
    - name: Install SWT
      run: |
        SWT_VERSION=4.37
        ARCH=$(uname -m)
        mkdir "swt-${SWT_VERSION}-gtk-linux-${ARCH}"
        cd "swt-${SWT_VERSION}-gtk-linux-${ARCH}"
        unzip -q "../swt-${SWT_VERSION}-gtk-linux-${ARCH}.zip"
        mvn install:install-file -Dfile=swt.jar -DgroupId=org.eclipse.swt -DartifactId=org.eclipse.swt.gtk.linux -Dpackaging=jar -Dversion=${SWT_VERSION}
    - name: Build with Maven
      run: cd desktop/build-scripts/tuxguitar-linux-swt-deb && mvn -e clean verify -P native-modules
    - uses: actions/upload-artifact@v7
      with:
        name: Package-Ubuntu
        path: desktop/build-scripts/tuxguitar-linux-swt-deb/target/tuxguitar-9.99-SNAPSHOT-linux-swt.deb

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    ##- name: Update dependency graph
    ##  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6