# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: MacOS Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-macOS:
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set value of TUX_ARCH
      run: echo "TUX_ARCH=$(uname -m | sed 's/arm64/aarch64/')" >> "$GITHUB_ENV"
    - name: Set value of SWT_VERSION
      run: echo "SWT_VERSION=4.37" >> "$GITHUB_ENV"
    - name: Download SWT
      run: |
        curl -fsSL -o "swt-${SWT_VERSION}-cocoa-macosx-${TUX_ARCH}.zip" \
          "https://archive.eclipse.org/eclipse/downloads/drops4/R-${SWT_VERSION}-202509050730/swt-${SWT_VERSION}-cocoa-macosx-${TUX_ARCH}.zip"
    - name: Install SWT
      run: |
        mkdir "swt-${SWT_VERSION}-cocoa-macosx-${TUX_ARCH}"
        cd "swt-${SWT_VERSION}-cocoa-macosx-${TUX_ARCH}"
        unzip -q "../swt-${SWT_VERSION}-cocoa-macosx-${TUX_ARCH}.zip"
        mvn install:install-file -Dfile=swt.jar -DgroupId=org.eclipse.swt -DartifactId=org.eclipse.swt.cocoa.macosx -Dpackaging=jar -Dversion=${SWT_VERSION}
    - name: Build with Maven
      run: cd desktop/build-scripts/tuxguitar-macosx-swt-cocoa && mvn -e clean verify
    - name: Rename app depending of arch
      run: mv desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target/tuxguitar-9.99-SNAPSHOT-macosx-swt-cocoa.app desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target/tuxguitar-9.99-SNAPSHOT-macosx-${TUX_ARCH}-swt-cocoa.app
    - uses: actions/upload-artifact@v7
      with:
        name: Package-MacOS-${{ matrix.os }}
        path: desktop/build-scripts/tuxguitar-macosx-swt-cocoa/target/tuxguitar-9.99-SNAPSHOT-macosx-${{ env.TUX_ARCH }}-swt-cocoa.app

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    ##- name: Update dependency graph
    ##  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6