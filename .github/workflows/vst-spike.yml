name: VST spike S0 (cross-compile)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'desktop/TuxGuitar-vst/jni/spike/**'
      - '.github/workflows/vst-spike.yml'

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install MinGW-w64 cross toolchain
      run: |
        sudo apt-get update
        sudo apt install -y cmake gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

    - name: Configure (Windows x64 cross)
      run: |
        cmake -S desktop/TuxGuitar-vst/jni/spike -B spike-build \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++

    - name: Build
      run: cmake --build spike-build -j"$(nproc)"

    - name: Upload spike exe
      uses: actions/upload-artifact@v7
      with:
        name: vst-spike-windows-x64
        path: spike-build/vst_spike.exe

  # Test loading REAL plugins on real Windows (CI runner).
  # No local execution required - results visible in Actions logs.
  smoke-test-windows:
    needs: spike
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Download spike exe from artifact
      uses: actions/download-artifact@v7
      with:
        name: vst-spike-windows-x64

    - name: Download Surge XT (free synth VST3 + CLAP in one package)
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        gh release download latest -R surge-synthesizer/releases-xt -p "*win64*pluginsonly*.zip" -O surge.zip
        Expand-Archive -Path surge.zip -DestinationPath surge
        Get-ChildItem -Recurse surge -Include *.vst3,*.clap | ForEach-Object { Write-Host $_.FullName }

    - name: Spike - test VST3 module
      shell: pwsh
      run: |
        $vst3 = Get-ChildItem -Recurse surge -Filter *.vst3 | Select-Object -First 1
        if ($vst3) { & .\vst_spike.exe "$($vst3.FullName)" } else { Write-Host "No .vst3 found in package" }

    - name: Spike - test CLAP file
      shell: pwsh
      run: |
        $clap = Get-ChildItem -Recurse surge -Filter *.clap | Select-Object -First 1
        if ($clap) { & .\vst_spike.exe "$($clap.FullName)" } else { Write-Host "No .clap found in package (skipped)" }